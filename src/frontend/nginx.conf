server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe endpoint — used by K8s liveness/readiness checks.
    location = /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA catch-all: serve index.html for any path not matched by a static file
    # so that React Router (if added later) handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
