---
# Bootstrap the Langfuse secret in AWS Secrets Manager and update the agent
# IAM policy so the agent pod can read it for prompt management.
#
# Run once (or after a secrets rotation) from:
#   Actions → 04 · Bootstrap Langfuse Secret → Run workflow
#
# Prerequisites:
#   LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_BASE_URL  ← GitHub secrets
#   AWS_ROLE_ARN, AWS_REGION                                     ← GitHub secrets
#
# What it does:
#   1. terraform apply targeting aws_iam_policy.agent_secrets
#      and aws_secretsmanager_secret.langfuse
#   2. aws secretsmanager put-secret-value to populate the keys

name: "04 · Bootstrap Langfuse Secret"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: Apply IAM policy + populate Langfuse secret
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform init
        run: terraform init
        env:
          TF_VAR_anthropic_api_key: "placeholder"  # init doesn't evaluate variables; kept for parity with other workflows
          TF_VAR_github_token: "unused"

      - name: Terraform plan (targeted)
        run: |
          terraform plan \
            -target=aws_iam_policy.agent_secrets \
            -target=aws_secretsmanager_secret.langfuse \
            -out=langfuse.tfplan
        env:
          TF_VAR_anthropic_api_key: "placeholder"   # not changing, just needed for plan
          TF_VAR_github_token: "unused"        # not changing, just needed for plan

      - name: Terraform apply (targeted)
        run: terraform apply -auto-approve langfuse.tfplan

      - name: Populate Langfuse secret value
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "${{ vars.PROJECT_NAME || 'agentify' }}/dev/langfuse" \
            --region    "${{ secrets.AWS_REGION }}" \
            --secret-string "$(cat <<EOF
          {
            "LANGFUSE_PUBLIC_KEY": "${{ secrets.LANGFUSE_PUBLIC_KEY }}",
            "LANGFUSE_SECRET_KEY": "${{ secrets.LANGFUSE_SECRET_KEY }}",
            "LANGFUSE_BASE_URL":   "${{ secrets.LANGFUSE_BASE_URL }}"
          }
          EOF
          )"
          echo "Langfuse secret populated successfully"

      - name: Verify
        run: |
          echo "=== IAM policy ==="
          aws iam get-policy-version \
            --policy-arn "arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):policy/agentify-dev-agent-secrets" \
            --version-id "$(aws iam get-policy --policy-arn "arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):policy/agentify-dev-agent-secrets" --query 'Policy.DefaultVersionId' --output text)" \
            --query 'PolicyVersion.Document.Statement[*].Resource' \
            --output table

          echo ""
          echo "=== Langfuse secret metadata ==="
          aws secretsmanager describe-secret \
            --secret-id "agentify/dev/langfuse" \
            --query '{Name:Name,LastChangedDate:LastChangedDate,ARN:ARN}' \
            --output table

          echo ""
          echo "Done. Redeploy the agent pod to pick up the new IAM permissions:"
          echo "  kubectl rollout restart deployment/agentify-agent -n agentify"

      - name: Job summary
        if: always()
        run: |
          {
            echo "Applied the agent_secrets IAM policy and populated the Langfuse secret in Secrets Manager."
            echo "Redeploy the agent pod to pick up the new IAM permissions."
          } >> "$GITHUB_STEP_SUMMARY"
