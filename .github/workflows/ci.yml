# CI: run tests on every push/PR.
# Keeps fast: no Docker build, no AWS calls. Tests run with in-memory/embedded backends.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: src/backend/go.mod
        cache: true
    - run: go build ./...
    - run: go vet ./...
    - run: go test ./... -timeout 120s
      env:
        REGISTRY_BACKEND: memory

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install -r requirements-dev.txt
    - run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*")
    - run: python -m pytest tests/ -q

  adapter:
    name: Adapter (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/adapters
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install kubernetes requests cryptography
    - run: python -m py_compile $(find k8fy -name "*.py")

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/frontend/package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm run build
