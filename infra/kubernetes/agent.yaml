apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentify-agent
  namespace: agentify
spec:
  replicas: 1
  # Allow 900s before the deployment controller marks the rollout as failed.
  # Must exceed the CI rollout-wait window (600s) so kubectl always sees the
  # deployment as "in progress" rather than "ProgressDeadlineExceeded" while
  # the stuck-pod cleanup loop is running.
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: agentify-agent
  template:
    metadata:
      labels:
        app: agentify-agent
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role:         "agentify-agentify-agent"
        vault.hashicorp.com/auth-path:    "auth/kubernetes"
        vault.hashicorp.com/agent-inject-secret-tls.crt: "pki-agentify/issue/agentify-agent"
        vault.hashicorp.com/agent-inject-template-tls.crt: |
          {{- with secret "pki-agentify/issue/agentify-agent"
              "common_name=agentify-agent.agentify.svc.cluster.local"
              "alt_names=localhost" "ttl=720h" -}}
          {{ .Data.certificate }}
          {{ .Data.issuing_ca }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-tls.key: "pki-agentify/issue/agentify-agent"
        vault.hashicorp.com/agent-inject-template-tls.key: |
          {{- with secret "pki-agentify/issue/agentify-agent"
              "common_name=agentify-agent.agentify.svc.cluster.local"
              "alt_names=localhost" "ttl=720h" -}}
          {{ .Data.private_key }}
          {{- end }}
        vault.hashicorp.com/agent-pre-populate-only: "false"
    spec:
      serviceAccountName: agentify-agent
      # 200s = 190s uvicorn graceful shutdown + 10s buffer.
      # Ensures in-flight Claude Opus calls (up to 180s) complete before SIGKILL.
      terminationGracePeriodSeconds: 200
      containers:
      - name: agent
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/agent:latest
        ports:
        - containerPort: 8001
        lifecycle:
          preStop:
            exec:
              # Give the ALB 10s to deregister this pod before connections are closed.
              command: ["/bin/sh", "-c", "sleep 10"]
        env:
        - name: PORT
          value: "8001"
        - name: AWS_REGION
          value: "ap-southeast-2"
        - name: BACKEND_URL
          value: "http://agentify-backend:8080"
        # ANTHROPIC_API_KEY from Secrets Manager secret agentify/dev/anthropic
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: agentify-anthropic-secret
              key: api_key
        # Vault connectivity for VaultCertSkill (optional — skill degrades gracefully if unset).
        - name: VAULT_ADDR
          value: "http://vault.vault.svc.cluster.local:8200"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-vault-secret
              key: token
              optional: true   # agent starts normally if Vault is not deployed
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: agentify-agent
  namespace: agentify
spec:
  selector:
    app: agentify-agent
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentify-agent
  namespace: agentify
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_agent_irsa_role_arn"
