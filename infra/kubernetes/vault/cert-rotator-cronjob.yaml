# cert-rotator — daily CronJob that checks TLS cert expiry in Vault PKI
# and renews any cert with fewer than 30 days remaining.
#
# The rotator authenticates to Vault using its Kubernetes ServiceAccount
# (bound to the "cert-rotator" Vault role via vault-setup.sh).
# It uses Vault's PKI API to:
#   1. Read the current cert expiry from the KV store
#   2. If < 30 days remaining: issue a new cert from pki/issue/payment-service
#   3. Store the renewed cert back in secret/payments/tls
#
# The Vault Agent Injector sidecar in the payment-service pods watches the
# PKI lease and automatically picks up renewed certs, then signals nginx.

# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-rotator
  namespace: payments
---
# ── CronJob ───────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-cert-rotator
  namespace: payments
spec:
  schedule: "0 0 * * *"    # daily at midnight UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: cert-rotator
          restartPolicy: OnFailure
          containers:
          - name: rotator
            image: python:3.11-slim
            env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_ROLE
              value: "cert-rotator"
            - name: PKI_ROLE
              value: "payment-service"
            - name: CERT_COMMON_NAME
              value: "payment.payments.svc.cluster.local"
            - name: CERT_TTL
              value: "720h"
            - name: RENEW_THRESHOLD_DAYS
              value: "30"
            - name: KV_PATH
              value: "secret/data/payments/tls"
            command:
            - python3
            - -c
            - |
              """Vault cert rotation script — checks expiry and renews if < threshold."""
              import os, sys, json, datetime
              import urllib.request, urllib.error

              VAULT_ADDR = os.environ["VAULT_ADDR"]
              VAULT_ROLE = os.environ["VAULT_ROLE"]
              PKI_ROLE   = os.environ["PKI_ROLE"]
              CN         = os.environ["CERT_COMMON_NAME"]
              TTL        = os.environ["CERT_TTL"]
              THRESHOLD  = int(os.environ["RENEW_THRESHOLD_DAYS"])
              KV_PATH    = os.environ["KV_PATH"]

              def vault_get(path, token):
                  req = urllib.request.Request(
                      f"{VAULT_ADDR}/v1/{path}",
                      headers={"X-Vault-Token": token},
                  )
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)

              def vault_post(path, token, data):
                  body = json.dumps(data).encode()
                  req = urllib.request.Request(
                      f"{VAULT_ADDR}/v1/{path}",
                      data=body,
                      headers={"X-Vault-Token": token, "Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)

              # 1. Authenticate via Kubernetes ServiceAccount JWT.
              print("Authenticating with Vault via Kubernetes auth...")
              sa_token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
              auth = vault_post("auth/kubernetes/login", "", {
                  "role": VAULT_ROLE,
                  "jwt":  sa_token,
              })
              token = auth["auth"]["client_token"]
              print("Authenticated successfully.")

              # 2. Read existing cert from KV and check expiry.
              try:
                  kv = vault_get(KV_PATH, token)
                  import ssl, io
                  cert_pem = kv["data"]["data"]["certificate"]
                  # Parse expiry using ssl module.
                  import subprocess, tempfile
                  with tempfile.NamedTemporaryFile(suffix=".pem", delete=False, mode="w") as f:
                      f.write(cert_pem)
                      tmpf = f.name
                  result = subprocess.run(
                      ["openssl", "x509", "-enddate", "-noout", "-in", tmpf],
                      capture_output=True, text=True,
                  )
                  # notAfter=Jun 17 00:00:00 2026 GMT
                  date_str = result.stdout.strip().split("=", 1)[1]
                  expiry = datetime.datetime.strptime(date_str, "%b %d %H:%M:%S %Y %Z")
                  days_remaining = (expiry - datetime.datetime.utcnow()).days
                  print(f"Current cert expires: {expiry.date()} ({days_remaining} days remaining)")
              except Exception as e:
                  print(f"Could not read existing cert ({e}) — will issue fresh cert.")
                  days_remaining = 0

              # 3. Rotate if below threshold.
              if days_remaining >= THRESHOLD:
                  print(f"Cert healthy ({days_remaining}d remaining, threshold {THRESHOLD}d). No rotation needed.")
                  sys.exit(0)

              print(f"Rotating cert (only {days_remaining} days remaining, threshold {THRESHOLD}d)...")
              new_cert = vault_post(f"pki/issue/{PKI_ROLE}", token, {
                  "common_name": CN,
                  "ttl":         TTL,
              })
              cert    = new_cert["data"]["certificate"]
              key     = new_cert["data"]["private_key"]
              issuing = new_cert["data"]["issuing_ca"]
              serial  = new_cert["data"]["serial_number"]
              print(f"New cert issued. Serial: {serial}")

              # 4. Store renewed cert in Vault KV so other consumers can read it.
              vault_post("secret/data/payments/tls", token, {
                  "data": {
                      "certificate": cert + "\n" + issuing,
                      "private_key": key,
                      "serial":      serial,
                      "renewed_at":  datetime.datetime.utcnow().isoformat(),
                  }
              })
              print("Renewed cert stored in Vault KV at secret/payments/tls")
              print("Vault Agent Injector will propagate the new cert to running pods.")
              print("Rotation complete.")
            resources:
              requests:
                memory: "64Mi"
                cpu:    "50m"
              limits:
                memory: "128Mi"
                cpu:    "200m"
