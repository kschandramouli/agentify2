# cert-rotator — daily CronJob that renews the payment-tls K8s Secret from Vault PKI.
#
# Authenticates to Vault via Kubernetes SA JWT, checks expiry of the current cert
# in the payment-tls secret, and renews if fewer than 30 days remain.
# Uses pki-payments/issue/payment-api (the correct mount for the payments namespace).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-rotator
  namespace: payments
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-cert-rotator
  namespace: payments
spec:
  schedule: "0 0 * * *"    # daily at midnight UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: cert-rotator
          restartPolicy: OnFailure
          containers:
          - name: rotator
            image: alpine:3.18
            env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_ROLE
              value: "cert-rotator"
            - name: PKI_MOUNT
              value: "pki-payments"
            - name: PKI_ROLE
              value: "payment-api"
            - name: CERT_COMMON_NAME
              value: "payment.payments.svc.cluster.local"
            - name: CERT_ALT_NAMES
              value: "payment-api.payments.svc.cluster.local,localhost"
            - name: CERT_TTL
              value: "720h"
            - name: RENEW_THRESHOLD_DAYS
              value: "30"
            - name: SECRET_NAME
              value: "payment-tls"
            - name: SECRET_NAMESPACE
              value: "payments"
            command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq openssl >/dev/null 2>&1

              echo "=== Vault cert rotator starting ==="

              # 1. Authenticate to Vault via K8s SA JWT
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              curl -sf -XPOST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -H "Content-Type: application/json" \
                -d "{\"jwt\":\"$JWT\",\"role\":\"$VAULT_ROLE\"}" \
                -o /tmp/login.json
              TOKEN=$(jq -r '.auth.client_token' /tmp/login.json)
              [ "$TOKEN" = "null" ] && { echo "Vault login failed:"; cat /tmp/login.json; exit 1; }
              echo "Authenticated to Vault."

              # 2. Check current cert expiry in the K8s Secret via Vault agent fetch
              #    (rotator reads the existing secret to decide whether rotation is needed)
              DAYS_REMAINING=0
              CURRENT_CERT=$(curl -sf \
                "https://kubernetes.default.svc/api/v1/namespaces/$SECRET_NAMESPACE/secrets/$SECRET_NAME" \
                --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                2>/dev/null | jq -r '.data["tls.crt"] // empty' | base64 -d 2>/dev/null)

              if [ -n "$CURRENT_CERT" ]; then
                echo "$CURRENT_CERT" > /tmp/current.crt
                EXPIRY=$(openssl x509 -enddate -noout -in /tmp/current.crt | cut -d= -f2)
                EXPIRY_TS=$(date -d "$EXPIRY" +%s 2>/dev/null || date -j -f "%b %d %H:%M:%S %Y %Z" "$EXPIRY" +%s 2>/dev/null)
                NOW_TS=$(date +%s)
                DAYS_REMAINING=$(( (EXPIRY_TS - NOW_TS) / 86400 ))
                echo "Current cert expires: $EXPIRY ($DAYS_REMAINING days remaining)"
              else
                echo "No existing cert found — will issue fresh cert."
              fi

              # 3. Skip rotation if cert is healthy
              if [ "$DAYS_REMAINING" -ge "$RENEW_THRESHOLD_DAYS" ]; then
                echo "Cert healthy ($DAYS_REMAINING days remaining, threshold ${RENEW_THRESHOLD_DAYS}d). No rotation needed."
                exit 0
              fi

              # 4. Issue new cert from Vault PKI
              echo "Issuing new cert from $PKI_MOUNT/issue/$PKI_ROLE ..."
              curl -sf -XPOST "$VAULT_ADDR/v1/$PKI_MOUNT/issue/$PKI_ROLE" \
                -H "X-Vault-Token: $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"common_name\":\"$CERT_COMMON_NAME\",\"alt_names\":\"$CERT_ALT_NAMES\",\"ttl\":\"$CERT_TTL\"}" \
                -o /tmp/new-cert.json
              jq -r '.data.certificate + "\n" + .data.issuing_ca' /tmp/new-cert.json > /tmp/tls.crt
              jq -r '.data.private_key' /tmp/new-cert.json > /tmp/tls.key
              SERIAL=$(jq -r '.data.serial_number' /tmp/new-cert.json)
              echo "New cert issued. Serial: $SERIAL"

              # 5. Update the K8s Secret payment-tls in-place
              CRT_B64=$(base64 -w0 /tmp/tls.crt)
              KEY_B64=$(base64 -w0 /tmp/tls.key)
              curl -sf -X PATCH \
                "https://kubernetes.default.svc/api/v1/namespaces/$SECRET_NAMESPACE/secrets/$SECRET_NAME" \
                --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                -H "Content-Type: application/strategic-merge-patch+json" \
                -d "{\"data\":{\"tls.crt\":\"$CRT_B64\",\"tls.key\":\"$KEY_B64\"}}"
              echo "K8s Secret $SECRET_NAMESPACE/$SECRET_NAME updated."

              # 6. Store copy in Vault KV for audit trail
              curl -sf -XPOST "$VAULT_ADDR/v1/secret/data/payments/tls" \
                -H "X-Vault-Token: $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"data\":{\"serial\":\"$SERIAL\",\"common_name\":\"$CERT_COMMON_NAME\"}}" \
                >/dev/null 2>&1 || true
              echo "=== Rotation complete ==="
            resources:
              requests:
                memory: "64Mi"
                cpu:    "50m"
              limits:
                memory: "128Mi"
                cpu:    "200m"
---
# RBAC: cert-rotator needs to patch the payment-tls Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-rotator
  namespace: payments
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["payment-tls"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-rotator
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-rotator
subjects:
- kind: ServiceAccount
  name: cert-rotator
  namespace: payments
