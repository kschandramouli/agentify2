# HashiCorp Vault — ALB Ingress (shares the agentify ALB via IngressGroup)
#
# The AWS Load Balancer Controller merges all Ingresses in the same
# alb.ingress.kubernetes.io/group.name into a single ALB.  This means no
# extra ALB is provisioned — Vault UI reuses the existing agentify ALB.
#
# Vault is accessible at the SAME hostname as the agentify frontend:
#   http://<agentify-alb>/ui/        ← Vault web UI  (login here)
#   http://<agentify-alb>/v1/        ← Vault HTTP API
#
# These paths do not conflict with the agentify routes (/api, /admin, /health,
# /metrics, /) because the ALB matches longest prefix first, so /ui/ and /v1/
# are evaluated before the catch-all /.
#
# Apply after running scripts/vault-setup.sh:
#   kubectl apply -f infra/kubernetes/vault/vault-ingress.yaml
#   kubectl get ingress vault-ui -n vault   # shows the SAME hostname as agentify

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ui
  namespace: vault
  annotations:
    kubernetes.io/ingress.class: alb

    # ── Join the existing agentify ALB (no new ALB created) ──────────────────
    alb.ingress.kubernetes.io/group.name:  agentify
    alb.ingress.kubernetes.io/group.order: "5"    # lower = higher priority; must be < agentify's order (10) so /ui and /v1 are evaluated before the catch-all /   # lower priority than agentify (order 10)

    # Must match the main ingress — controller validates group members are consistent.
    alb.ingress.kubernetes.io/scheme:      internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # Vault returns 200/429/473/501/503 depending on seal/init state — accept all.
    alb.ingress.kubernetes.io/healthcheck-path:             /v1/sys/health
    alb.ingress.kubernetes.io/success-codes:                "200,429,473,501,503"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"

spec:
  rules:
  - http:
      paths:
        # Vault web UI — assets and redirects all work under /ui/ natively.
      - path: /ui
        pathType: Prefix
        backend:
          service:
            name: vault
            port:
              number: 8200
        # Vault HTTP API — used by the VaultCertSkill and the cert rotator.
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: vault
            port:
              number: 8200
