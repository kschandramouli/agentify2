# HashiCorp Vault — ALB Ingress (shares the agentify ALB via IngressGroup)
#
# Vault UI:  http://<agentify-alb>/ui/    token: root (dev mode)
# Vault API: http://<agentify-alb>/v1/
#
# IngressGroup lets both Ingresses share one ALB — no extra cost.
# group.order: 5 (vault) < 10 (agentify) so /ui and /v1 rules are
# evaluated before agentify's catch-all /.
#
# IMPORTANT: AWS ALB only accepts success-codes in 200-499.
#   200 = active/healthy   429 = standby   473 = performance standby
#   501 (not init) and 503 (sealed) are INVALID for ALB — omit them.
#   In Vault dev mode the pod always returns 200.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ui
  namespace: vault
  annotations:
    kubernetes.io/ingress.class: alb

    # ── Share the agentify ALB (IngressGroup) ────────────────────────────────
    alb.ingress.kubernetes.io/group.name:  agentify
    alb.ingress.kubernetes.io/group.order: "5"   # evaluated before agentify catch-all (order 10)

    alb.ingress.kubernetes.io/scheme:      internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/healthcheck-path:              /v1/sys/health
    # 200-499 only — 501/503 are outside ALB's allowed range and cause ValidationError
    alb.ingress.kubernetes.io/success-codes:                 "200,429,473"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds:  "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds:   "5"

spec:
  rules:
  - http:
      paths:
      - path: /ui
        pathType: Prefix
        backend:
          service:
            name: vault
            port:
              number: 8200
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: vault
            port:
              number: 8200
