# HashiCorp Vault — dedicated ALB Ingress
#
# Creates its own internet-facing ALB in the vault namespace.
# Vault UI: http://<VAULT-ALB>/ui/     (login token: "root" in dev mode)
# Vault API: http://<VAULT-ALB>/v1/
#
# Note: IngressGroup was attempted to share the agentify ALB but the AWS
# ALB controller does not reconcile cross-namespace Ingresses into the same
# group — /ui and /v1 never appeared in the ALB rule table.  A dedicated
# ALB is simpler and guaranteed to work.
#
# Apply:  kubectl apply -f infra/kubernetes/vault/vault-ingress.yaml
# Check:  kubectl get ingress vault-ui -n vault

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ui
  namespace: vault
  annotations:
    kubernetes.io/ingress.class:                             alb
    alb.ingress.kubernetes.io/scheme:                        internet-facing
    alb.ingress.kubernetes.io/target-type:                   ip

    alb.ingress.kubernetes.io/listen-ports:                  '[{"HTTP":80}]'

    # Vault health returns different codes depending on state — accept all
    # so the ALB target stays healthy during init and unseal.
    alb.ingress.kubernetes.io/healthcheck-path:              /v1/sys/health
    alb.ingress.kubernetes.io/success-codes:                 "200,429,473,501,503"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds:  "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds:   "5"

    alb.ingress.kubernetes.io/load-balancer-attributes:      idle_timeout.timeout_seconds=60

spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vault
            port:
              number: 8200
