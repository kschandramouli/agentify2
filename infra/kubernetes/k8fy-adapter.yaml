apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8fy-adapter
  namespace: agentify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8fy-adapter
  template:
    metadata:
      labels:
        app: k8fy-adapter
      annotations: {}
    spec:
      serviceAccountName: k8fy-adapter
      containers:
      - name: k8fy-adapter
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/k8fy-adapter:latest
        ports:
        - name: logserver
          containerPort: 8200   # on-demand pod log server (spec 008)
          protocol: TCP
        env:
        - name: BACKEND_URL
          value: "http://agentify-backend:8080"
        - name: K8S_NAMESPACE
          value: "*"          # cluster-wide mode — watches all non-system namespaces
        - name: SCRAPE_INTERVAL
          value: "30"
        - name: CERT_CHECK_INTERVAL
          value: "30"    # fast for test env; restore to 300 for prod
        - name: LOG_SERVER_PORT
          value: "8200"
        - name: MAX_TAIL_LINES
          value: "200"
        # ADAPTER_AUTH_TOKEN loaded from Secrets Manager via External Secrets Operator,
        # or manually created as a K8s Secret and referenced here.
        - name: ADAPTER_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-adapter-secret
              key: token
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: k8fy-adapter
  namespace: agentify
spec:
  selector:
    app: k8fy-adapter
  ports:
  - name: logserver
    port: 8200
    targetPort: 8200
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8fy-adapter
  namespace: agentify
  annotations:
    # IRSA: replaced by the actual role ARN from Terraform output adapter_irsa_role_arn
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_adapter_irsa_role_arn"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8fy-adapter
rules:
- apiGroups: [""]
  resources: ["pods", "services", "secrets", "events"]
  verbs: ["list", "watch", "get"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Cluster-wide namespace listing (for discovery endpoint + cluster-wide watches)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list", "get"]
# Deployment watch for change/rollout events (spec 007)
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list", "watch", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8fy-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8fy-adapter
subjects:
- kind: ServiceAccount
  name: k8fy-adapter
  namespace: agentify
