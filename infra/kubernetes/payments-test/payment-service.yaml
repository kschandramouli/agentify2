# payment-service — nginx serving HTTPS using a TLS cert injected by Vault Agent.
#
# The Vault Agent sidecar reads the cert from the PKI secrets engine on startup
# and writes it to /vault/secrets/tls.crt + tls.key.  nginx uses those files.
# When the cert is renewed by the rotator CronJob, the Vault Agent sidecar
# detects the change and sends nginx a SIGHUP for zero-downtime reload.
#
# Prerequisites: scripts/vault-setup.sh must have run to create:
#   - Kubernetes auth role "payment-service"
#   - PKI role "payment-service"

# ── ServiceAccount bound to the Vault Kubernetes auth role ───────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: payments
---
# ── nginx TLS config (served via ConfigMap) ───────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-tls-config
  namespace: payments
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 443 ssl;
        server_name payment.payments.svc.cluster.local;
        ssl_certificate     /vault/secrets/tls.crt;
        ssl_certificate_key /vault/secrets/tls.key;
        location / {
          return 200 '{"status":"ok","service":"payment-service"}';
          add_header Content-Type application/json;
        }
        location /health {
          return 200 '{"status":"healthy"}';
          add_header Content-Type application/json;
        }
      }
    }
---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: payments
  labels:
    app: payment
    vault-managed-certs: "true"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
      annotations:
        # ── Vault Agent Injector (pki-payments namespace PKI) ────────────────
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role:         "payments-payment-api"
        vault.hashicorp.com/auth-path:    "auth/kubernetes"
        vault.hashicorp.com/agent-pre-populate-only: "false"

        vault.hashicorp.com/agent-inject-secret-tls.crt: "pki-payments/issue/payment-api"
        vault.hashicorp.com/agent-inject-template-tls.crt: |
          {{- with secret "pki-payments/issue/payment-api"
              "common_name=payment.payments.svc.cluster.local"
              "alt_names=localhost" "ttl=720h" -}}
          {{ .Data.certificate }}
          {{ .Data.issuing_ca }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-tls.key: "pki-payments/issue/payment-api"
        vault.hashicorp.com/agent-inject-template-tls.key: |
          {{- with secret "pki-payments/issue/payment-api"
              "common_name=payment.payments.svc.cluster.local"
              "alt_names=localhost" "ttl=720h" -}}
          {{ .Data.private_key }}
          {{- end }}
        vault.hashicorp.com/agent-inject-command-tls.crt: "nginx -s reload || true"
    spec:
      serviceAccountName: payment-api
      containers:
      - name: payment
        image: nginx:1.25-alpine
        ports:
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        readinessProbe:
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            memory: "32Mi"
            cpu:    "10m"
          limits:
            memory: "64Mi"
            cpu:    "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-tls-config
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: payments
spec:
  selector:
    app: payment
  ports:
  - name: https
    port: 443
    targetPort: 443
  type: ClusterIP
