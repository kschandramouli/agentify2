# Healthy payment service — 2 replicas of nginx serving HTTP.
# Phase 1: both replicas healthy → service HEALTHY (100% ready).
# Phase 3: payment-worker crashes alongside this → service DEGRADED overall.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: payments
  annotations:
    # Tracked by k8fy adapter watch_deployments — rollout bumps this revision.
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: payments
spec:
  selector:
    app: payment
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
