# ServiceAccounts for each payment service.
# These are bound to Vault Kubernetes auth roles by vault-bootstrap.sh
# so Vault Agent Injector can authenticate and fetch secrets at pod startup.

# ── payments namespace ────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-api
  namespace: payments
  annotations:
    vault.io/role:   "payments-payment-api"
    vault.io/policy: "payments-payment-api-policy"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-worker
  namespace: payments
  annotations:
    vault.io/role:   "payments-payment-worker"
    vault.io/policy: "payments-payment-worker-policy"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-rotator
  namespace: payments
  annotations:
    vault.io/role:   "cert-rotator"
    vault.io/policy: "cert-rotator-policy"
---
# RBAC: allows agentify-agent to PATCH the payment-tls Secret during on-demand renewal.
# The agent calls the K8s API directly (in-cluster) when rotate_vault_cert is triggered.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-cert-renewer
  namespace: payments
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["payment-tls"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-cert-renewer
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-cert-renewer
subjects:
- kind: ServiceAccount
  name: agentify-agent
  namespace: agentify
---
# RBAC: allows agentify-agent to restart/scale/rollback the payment Deployments
# (ADR 0020 / spec 011 Use Cases 1+2 — Phase-3 remediation). Only reachable via
# the deterministic execute_remediation path after a human has approved a
# pending proposal — see src/agent/k8fy/action_executor.py. Scoped to the two
# named Deployments only, not namespace-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-remediator
  namespace: payments
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["payment-api", "payment-worker"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  resourceNames: ["payment-api", "payment-worker"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-remediator
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-remediator
subjects:
- kind: ServiceAccount
  name: agentify-agent
  namespace: agentify
---
# RBAC: allows agentify-agent to make LIVE, READ-ONLY Kubernetes API calls for
# the Chat UI's diagnostics console (src/agent/k8fy/live_diagnostics.py) —
# distinct from the tools above, which read the ingested/cached store, not the
# cluster directly. Read-only verbs only: no pods/exec, no secrets, no write
# verbs anywhere. Not resourceName-scoped like agent-remediator above, since
# pod names are dynamic per rollout (unlike the two fixed Deployment names).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-live-diagnostics
  namespace: payments
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-live-diagnostics
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-live-diagnostics
subjects:
- kind: ServiceAccount
  name: agentify-agent
  namespace: agentify
