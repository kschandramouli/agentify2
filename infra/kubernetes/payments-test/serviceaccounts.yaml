# ServiceAccounts for each payment service.
# These are bound to Vault Kubernetes auth roles by vault-bootstrap.sh
# so Vault Agent Injector can authenticate and fetch secrets at pod startup.

# ── payments namespace ────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-api
  namespace: payments
  annotations:
    vault.io/role:   "payments-payment-api"
    vault.io/policy: "payments-payment-api-policy"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-worker
  namespace: payments
  annotations:
    vault.io/role:   "payments-payment-worker"
    vault.io/policy: "payments-payment-worker-policy"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-rotator
  namespace: payments
  annotations:
    vault.io/role:   "cert-rotator"
    vault.io/policy: "cert-rotator-policy"
---
# RBAC: allows agentify-agent to PATCH the payment-tls Secret during on-demand renewal.
# The agent calls the K8s API directly (in-cluster) when rotate_vault_cert is triggered.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-cert-renewer
  namespace: payments
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["payment-tls"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-cert-renewer
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-cert-renewer
subjects:
- kind: ServiceAccount
  name: agentify-agent
  namespace: agentify
