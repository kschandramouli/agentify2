# ServiceAccount so the Vault Agent Injector can authenticate this pod to Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentify-frontend
  namespace: agentify
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentify-frontend
  namespace: agentify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentify-frontend
  template:
    metadata:
      labels:
        app: agentify-frontend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role:         "agentify-agentify-frontend"
        vault.hashicorp.com/auth-path:    "auth/kubernetes"
        vault.hashicorp.com/agent-inject-secret-tls.crt: "pki-agentify/issue/agentify-frontend"
        vault.hashicorp.com/agent-inject-template-tls.crt: |
          {{- with secret "pki-agentify/issue/agentify-frontend"
              "common_name=agentify-frontend.agentify.svc.cluster.local"
              "alt_names=localhost" "ttl=720h" -}}
          {{ .Data.certificate }}
          {{ .Data.issuing_ca }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-tls.key: "pki-agentify/issue/agentify-frontend"
        vault.hashicorp.com/agent-inject-template-tls.key: |
          {{- with secret "pki-agentify/issue/agentify-frontend"
              "common_name=agentify-frontend.agentify.svc.cluster.local"
              "alt_names=localhost" "ttl=720h" -}}
          {{ .Data.private_key }}
          {{- end }}
        vault.hashicorp.com/agent-pre-populate-only: "false"
    spec:
      serviceAccountName: agentify-frontend
      containers:
      - name: frontend
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/frontend:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: agentify-frontend
  namespace: agentify
spec:
  selector:
    app: agentify-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
