apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentify-frontend
  namespace: agentify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentify-frontend
  template:
    metadata:
      labels:
        app: agentify-frontend
    spec:
      containers:
      - name: frontend
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/frontend:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: agentify-frontend
  namespace: agentify
spec:
  selector:
    app: agentify-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
