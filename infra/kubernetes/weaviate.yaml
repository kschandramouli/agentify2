apiVersion: v1
kind: Namespace
metadata:
  name: agentify

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weaviate-config
  namespace: agentify
data:
  # Weaviate configuration
  QUERY_DEFAULTS_LIMIT: "25"
  AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
  DEFAULT_VECTORIZER_MODULE: "none"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: agentify
spec:
  replicas: 1  # For MVP; increase for HA
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
      - name: weaviate
        image: semitechnologies/weaviate:latest
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: weaviate-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /v1/.well-known/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/.well-known/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: weaviate-data
          mountPath: /var/lib/weaviate
      volumes:
      - name: weaviate-data
        persistentVolumeClaim:
          claimName: weaviate-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weaviate-pvc
  namespace: agentify
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2  # AWS EBS gp2; change for your cloud provider
  resources:
    requests:
      storage: 20Gi  # Adjust based on vector count

---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: agentify
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: weaviate

---
# (Optional) Expose Weaviate externally via LoadBalancer or Ingress
# For enterprise, use AWS ALB Ingress Controller
apiVersion: v1
kind: Service
metadata:
  name: weaviate-lb
  namespace: agentify
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: weaviate
