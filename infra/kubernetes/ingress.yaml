# ALB Ingress: routes traffic to frontend (/*) and backend API (/api, /admin, /health, /metrics).
# Requires the AWS Load Balancer Controller (installed by Terraform).
# Path specificity: more-specific prefixes (/api, /admin, /health, /metrics) beat the
# catch-all (/) because ALB evaluates longest-prefix first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentify
  namespace: agentify
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Dev: HTTP only — HTTPS requires an ACM certificate + domain.
    # To enable HTTPS: request a cert in ACM, uncomment and fill the lines below,
    # then restore listen-ports to '[{"HTTP":80},{"HTTPS":443}]' and add ssl-redirect.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Raise ALB idle timeout above backend WriteTimeout (180s) so Opus calls
    # don't get cut off by the ALB before the backend finishes writing.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:175920682311:certificate/...
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  rules:
  - http:
      paths:
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: agentify-backend
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: agentify-backend
            port:
              number: 8080
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: agentify-backend
            port:
              number: 8080
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: agentify-backend
            port:
              number: 8080
      # Catch-all: frontend SPA. Must be last — ALB matches longest prefix first.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentify-frontend
            port:
              number: 80
